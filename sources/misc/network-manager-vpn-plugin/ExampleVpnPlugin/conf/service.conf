<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
	<policy user="root">
		<allow own="@dbus-service-name@"/>
		<allow send_destination="@dbus-service-name@"/>
		<allow receive_sender="@dbus-service-name@"/>
	</policy>
	<policy context="default">
		<deny own="@dbus-service-name@"/>
		<deny send_destination="@dbus-service-name@"/>
	</policy>
</busconfig>
